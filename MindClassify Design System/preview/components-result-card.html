<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-cream); }
  body { padding: 14px 18px; font-family: var(--font-sans); }
  .card { background: var(--color-paper); border: 1.5px solid var(--color-anxiety-line); border-radius: var(--r-md); padding: 16px 18px; box-shadow: var(--shadow-sm); }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-ink-3); }
  .label { display: flex; align-items: center; gap: 6px; font-family: var(--font-serif); font-weight: 700; font-size: 24px; color: var(--color-anxiety-ink); line-height: 1; }
  .gauge { font-weight: 800; font-size: 18px; color: var(--color-anxiety-ink); }
  .gauge small { font-weight: 500; font-size: 10px; color: var(--color-ink-3); display: block; text-transform: uppercase; letter-spacing: 0.08em; }
  .tip { background: var(--color-anxiety-bg); border: 1px solid var(--color-anxiety-line); border-radius: var(--r-sm); padding: 8px 12px; font-size: 12.5px; color: var(--color-anxiety-ink); margin-top: 4px; }
  .tip b { font-weight: 700; }
  .bars { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
  .bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--color-ink-2); }
  .bar .n { width: 80px; }
  .bar .t { flex: 1; background: var(--color-paper-deep); border-radius: 999px; height: 5px; overflow: hidden; }
  .bar .f { height: 5px; border-radius: 999px; }
  .bar .v { width: 32px; text-align: right; color: var(--color-ink-3); }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div>
        <div class="eyebrow">Classification</div>
        <div class="label">😰 Anxiety</div>
      </div>
      <div class="gauge" style="text-align:right;">82.0%<small>confidence</small></div>
    </div>
    <div class="tip"><b>Suggestion:</b> Breathing exercises and grounding techniques can help in the moment.</div>
    <div class="bars">
      <div class="bar"><span class="n">Anxiety</span>     <span class="t"><span class="f" style="width:82%; background:var(--color-anxiety-ink)"></span></span><span class="v">82%</span></div>
      <div class="bar"><span class="n">Stress</span>      <span class="t"><span class="f" style="width:11%; background:var(--color-stress-ink)"></span></span><span class="v">11%</span></div>
      <div class="bar"><span class="n">Normal</span>      <span class="t"><span class="f" style="width:4%;  background:var(--color-normal-ink)"></span></span><span class="v">4%</span></div>
    </div>
  </div>
</body>
</html>
