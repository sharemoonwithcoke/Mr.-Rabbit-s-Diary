<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-cream); }
  body { padding: 18px 22px; font-family: var(--font-sans); }
  .grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;
  }
  .chip {
    border-radius: var(--r-md); overflow: hidden;
    border: 1px solid var(--color-line);
    background: var(--color-paper);
    display: flex; flex-direction: column;
    min-height: 110px;
  }
  .chip .ink { flex: 1; }
  .chip .meta {
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 2px;
    border-top: 1px solid var(--color-line-soft);
    background: var(--color-paper);
  }
  .chip .name { font-size: 11.5px; font-weight: 700; color: var(--color-ink); line-height: 1.2; }
  .chip .hex  { font-size: 10.5px; font-family: var(--font-mono); color: var(--color-ink-3); letter-spacing: -0.02em; }
</style>
</head>
<body>
  <div class="grid">
    <div class="chip"><div class="ink" style="background:var(--color-normal-ink)"></div><div class="meta"><div class="name">Normal</div><div class="hex">#5B8C6A</div></div></div>
    <div class="chip"><div class="ink" style="background:var(--color-depression-ink)"></div><div class="meta"><div class="name">Depression</div><div class="hex">#6B8FB5</div></div></div>
    <div class="chip"><div class="ink" style="background:var(--color-suicidal-ink)"></div><div class="meta"><div class="name">Suicidal</div><div class="hex">#C75440</div></div></div>
    <div class="chip"><div class="ink" style="background:var(--color-anxiety-ink)"></div><div class="meta"><div class="name">Anxiety</div><div class="hex">#D17A1E</div></div></div>
    <div class="chip"><div class="ink" style="background:var(--color-stress-ink)"></div><div class="meta"><div class="name">Stress</div><div class="hex">#9A6F95</div></div></div>
    <div class="chip"><div class="ink" style="background:var(--color-bipolar-ink)"></div><div class="meta"><div class="name">Bipolar</div><div class="hex">#4E9499</div></div></div>
    <div class="chip"><div class="ink" style="background:var(--color-personality-ink)"></div><div class="meta"><div class="name">Personality</div><div class="hex">#8B6D4F</div></div></div>
  </div>
</body>
</html>
