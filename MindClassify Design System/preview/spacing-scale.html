<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-cream); }
  body { padding: 20px 26px; font-family: var(--font-sans); }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar  { background: var(--color-honey-soft); border: 1px solid var(--color-anxiety-line); border-radius: var(--r-sm); height: 28px; }
  .name { font-size: 11px; font-weight: 700; color: var(--color-ink); }
  .v    { font-family: var(--font-mono); font-size: 10px; color: var(--color-ink-3); }
</style>
</head>
<body>
  <div class="row">
    <div class="step"><div class="bar" style="width: 4px"></div>  <div class="name">1</div><div class="v">4px</div></div>
    <div class="step"><div class="bar" style="width: 8px"></div>  <div class="name">2</div><div class="v">8px</div></div>
    <div class="step"><div class="bar" style="width: 12px"></div> <div class="name">3</div><div class="v">12px</div></div>
    <div class="step"><div class="bar" style="width: 16px"></div> <div class="name">4</div><div class="v">16px</div></div>
    <div class="step"><div class="bar" style="width: 20px"></div> <div class="name">5</div><div class="v">20px</div></div>
    <div class="step"><div class="bar" style="width: 24px"></div> <div class="name">6</div><div class="v">24px</div></div>
    <div class="step"><div class="bar" style="width: 32px"></div> <div class="name">8</div><div class="v">32px</div></div>
    <div class="step"><div class="bar" style="width: 40px"></div> <div class="name">10</div><div class="v">40px</div></div>
    <div class="step"><div class="bar" style="width: 48px"></div> <div class="name">12</div><div class="v">48px</div></div>
    <div class="step"><div class="bar" style="width: 64px"></div> <div class="name">16</div><div class="v">64px</div></div>
  </div>
</body>
</html>
