<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-cream); }
  body { padding: 18px 22px; font-family: var(--font-sans); }
  .card {
    background: var(--color-paper); border: 1px solid var(--color-line);
    border-radius: var(--r-md); box-shadow: var(--shadow-sm);
    padding: 16px 18px;
  }
  .row { display: flex; align-items: flex-start; gap: 14px; justify-content: space-between; }
  .title { font-weight: 700; font-size: 15px; color: var(--color-ink); margin: 0 0 4px; }
  .preview { font-size: 13px; color: var(--color-ink-2); line-height: 1.5; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px 4px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700;
    background: var(--color-anxiety-bg); color: var(--color-anxiety-ink);
    border: 1px solid var(--color-anxiety-line);
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-anxiety-ink); }
  .conf { font-size: 11px; color: var(--color-ink-3); }
  .footer { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--color-line-soft); font-size: 11px; color: var(--color-ink-3); }
  .del   { color: var(--color-suicidal-ink); cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div>
        <h3 class="title">A long Tuesday</h3>
        <p class="preview">Tried to take the morning slow. Couldn't shake the tight feeling in my chest until I got outside and saw the light hitting the leaves.</p>
      </div>
      <div class="right">
        <span class="chip"><span class="dot"></span>Anxiety</span>
        <span class="conf">82% conf.</span>
      </div>
    </div>
    <div class="footer">
      <span>25 May 2026 · 14:32</span>
      <span class="del">Delete</span>
    </div>
  </div>
</body>
</html>
