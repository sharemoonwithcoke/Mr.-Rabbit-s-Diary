<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-cream); }
  body { padding: 20px 26px; }
  .card {
    background: linear-gradient(135deg, #fdfaf4 0%, #fdf6e3 100%);
    border: 1px solid var(--color-diary-line);
    border-radius: var(--r-md);
    padding: 16px 20px;
  }
  .eyebrow {
    font-family: var(--font-sans); font-weight: 700; font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--color-diary-accent);
    display: flex; align-items: center; gap: 8px;
  }
  .divider { height: 1px; background: rgba(253, 230, 138, 0.6); margin: 10px 0 12px; }
  .voice {
    font-family: var(--font-serif); font-style: italic; font-size: 15px;
    line-height: 1.65; color: var(--color-diary-ink);
  }
  .sign {
    font-family: var(--font-hand); font-size: 18px;
    color: var(--color-diary-accent); text-align: right; margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow"><span>🪶</span> YOUR DIARY REPLIES</div>
    <div class="divider"></div>
    <div class="voice">The night is heavy, I know — but heavy is not the same as endless. Let the breath you just took be enough for now.</div>
    <div class="sign">— written for you, 25 May</div>
  </div>
</body>
</html>
