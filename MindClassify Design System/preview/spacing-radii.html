<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-cream); }
  body { padding: 22px 28px; font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .radius {
    background: var(--color-paper); border: 1px solid var(--color-line);
    box-shadow: var(--shadow-sm); padding: 8px 10px;
    font-family: var(--font-mono); font-size: 11px; color: var(--color-ink-3);
  }
  .name { font-family: var(--font-sans); font-weight: 700; color: var(--color-ink); font-size: 12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="radius" style="border-radius: 6px;  width: 70px; height: 70px;"><div class="name">xs</div>6px</div>
    <div class="radius" style="border-radius: 10px; width: 80px; height: 80px;"><div class="name">sm</div>10px</div>
    <div class="radius" style="border-radius: 14px; width: 90px; height: 90px;"><div class="name">md</div>14px</div>
    <div class="radius" style="border-radius: 18px; width: 100px;height: 100px;"><div class="name">lg</div>18px</div>
    <div class="radius" style="border-radius: 24px; width: 110px;height: 110px;"><div class="name">xl</div>24px</div>
    <div class="radius" style="border-radius: 999px;width: 120px;height: 70px; display:flex; flex-direction:column; justify-content:center; align-items:center;"><div class="name">pill</div>999px</div>
  </div>
</body>
</html>
