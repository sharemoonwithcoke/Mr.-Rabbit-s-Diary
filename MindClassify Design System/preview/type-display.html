<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-cream); }
  body { padding: 22px 28px; }
  .display {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 56px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--color-ink);
    margin: 0;
  }
  .display .it { font-style: italic; color: var(--color-honey-ink); font-weight: 500; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-ink-3); margin-top: 14px; letter-spacing: -0.02em; }
</style>
</head>
<body>
  <h1 class="display">Write freely, <span class="it">softly.</span></h1>
  <div class="meta">Lora · 56/58 · 600 · -0.025em · &lt;h1&gt;</div>
</body>
</html>
