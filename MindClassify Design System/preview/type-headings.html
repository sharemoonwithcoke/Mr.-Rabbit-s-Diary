<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-cream); }
  body { padding: 18px 24px; font-family: var(--font-sans); }
  .spec { display: grid; grid-template-columns: 1fr auto; gap: 4px 18px; align-items: baseline; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--color-ink-3); letter-spacing: -0.02em; white-space: nowrap; }
  h2 { margin: 0; }
  h3 { margin: 0; }
  h4 { margin: 0; }
  p  { margin: 0; }
</style>
</head>
<body>
  <div class="spec">
    <h2>Today's entry, May 25</h2>
    <div class="meta">Lora · 28 · 600 · h2</div>

    <h3>Classification result</h3>
    <div class="meta">Jakarta · 20 · 700 · h3</div>

    <h4>How are you feeling today?</h4>
    <div class="meta">Jakarta · 16 · 600 · h4 / label</div>

    <p>Write freely — describe your thoughts, feelings, or anything on your mind. Your diary will listen, and write back.</p>
    <div class="meta">Jakarta · 15 · 400 · body</div>
  </div>
</body>
</html>
