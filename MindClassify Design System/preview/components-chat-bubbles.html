<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-cream); }
  body { padding: 18px 22px; font-family: var(--font-sans); }
  .thread { background: linear-gradient(180deg, #fdfaf4 0%, #f9fafb 100%); border: 1px solid var(--color-line); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.user { justify-content: flex-end; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--color-honey-soft); border: 1px solid var(--color-diary-line); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .bubble { max-width: 70%; padding: 8px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.55; }
  .bubble.bot { background: var(--color-paper); border: 1px solid var(--color-diary-line); color: var(--color-diary-ink); font-family: var(--font-serif); font-style: italic; border-bottom-left-radius: 4px; }
  .bubble.user { background: var(--color-honey); color: white; border-bottom-right-radius: 4px; }
  .typing { display: inline-flex; gap: 4px; padding: 10px 14px; background: var(--color-paper); border: 1px solid var(--color-diary-line); border-radius: 16px; border-bottom-left-radius: 4px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: #d97706; opacity: 0.7; animation: b 1s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes b { 0%,80%,100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-4px); opacity: 1; } }
</style>
</head>
<body>
  <div class="thread">
    <div class="row"><div class="avatar">🪶</div><div class="bubble bot">Hi, I'm your diary companion. What would you like to share today?</div></div>
    <div class="row user"><div class="bubble user">I've been tired in a way sleep doesn't fix.</div></div>
    <div class="row"><div class="avatar">🪶</div><div class="typing"><span></span><span></span><span></span></div></div>
  </div>
</body>
</html>
